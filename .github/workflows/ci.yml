name: CI

# Runs on every PR and on pushes to non-main branches. Type-checks, tests, and
# validates the SAM template. No AWS credentials are used here — this gate is
# safe to run on forks/PRs.
on:
  pull_request:
  push:
    branches-ignore:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@8.15.0 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # MUST run before type-check. The shared packages are TypeScript composite projects, so
      # shared/utils type-checks through a project reference to shared/types and needs
      # shared/types/dist/index.d.ts to exist. On a clean checkout it does not, and tsc fails with
      # TS6305 "Output file has not been built from source file".
      #
      # This is why `ci.yml` had never passed on a pull request — including a docs-only one. It
      # passed on every developer machine, where a previous build had left dist/ and .tsbuildinfo
      # lying around, and failed on every clean checkout. Deploy (production) runs on main pushes
      # and builds first, so it stayed green: the gate meant to protect the deployment was red
      # while the deployment itself was green.
      #
      # Same defect class as Bridle's, fixed there on 2026-08-05: a check that silently depends on
      # build output tests the machine it runs on, not the repository.
      - name: Build (shared packages must exist before anything type-checks them)
        run: pnpm build

      - name: Type-check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      # SAM CLI is pre-installed on ubuntu-latest GitHub-hosted runners.
      - name: Validate SAM template
        run: sam validate -t infra/template.yaml --lint

      - name: Migration manifest check
        run: node scripts/check-migrations.mjs
