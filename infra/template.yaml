AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: HDICR Service - Lambda + API Gateway

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs24.x
    Environment:
      Variables:
        NODE_ENV: !Ref Environment
        AUTH0_DOMAIN: !Ref Auth0Domain
        AUTH0_AUDIENCE: !Ref Auth0Audience
        AUTH0_CLIENT_ID: !Ref AUTH0ClientId
        HDICR_DEFAULT_TENANT_ID: !Ref HDICRDefaultTenantId
        AUTH0_ROLES_CLAIM_NAMESPACE: !Ref Auth0RolesClaimNamespace
        AUTH0_TENANT_ID_CLAIM_NAMESPACE: !Ref Auth0TenantIdClaimNamespace
        DB_POOL_SIZE: !Ref DBPoolSize
        # The DB connection string (which contains the password) is read from
        # Secrets Manager at runtime via each function's execution role — never
        # baked into a plaintext Lambda env var. Resolved by infra/database
        # DatabaseClient. AUTH0_CLIENT_SECRET / JWT_SIGNING_KEY were previously
        # set here but are not read by the request path (auth uses Auth0 JWKS),
        # so they have been removed rather than migrated.
        DB_URL_SECRET_ARN: !Ref DbUrlSecretArn

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues:
      - development
      - staging
      - production

  DbUrlSecretArn:
    Type: String
    Default: arn:aws:secretsmanager:eu-west-1:440779547223:secret:/hdicr/prod/db/url-h6XyzY
    Description: >-
      ARN of the Secrets Manager secret holding the Postgres connection string.
      Passed to the functions as DB_URL_SECRET_ARN and read at runtime; this is a
      resource identifier, not a secret value, so it is safe as a plain env var.

  Auth0Domain:
    Type: String

  Auth0Audience:
    Type: String
    # Comma-separated list of accepted API audiences. During the hdicr.com
    # cutover set both the new and legacy identifiers so existing TI tokens keep
    # validating, e.g. "https://hdicr.com,https://hdicr.trulyimagined.com".
    Default: https://hdicr.trulyimagined.com

  HDICRDefaultTenantId:
    Type: String
    Default: trulyimagined

  Auth0RolesClaimNamespace:
    Type: String
    Default: https://trulyimagined.com/roles

  Auth0TenantIdClaimNamespace:
    Type: String
    Default: https://trulyimagined.com/tenant_id

  DBPoolSize:
    Type: String
    Default: "20"

  S3BucketName:
    Type: String
    Default: trulyimagined-media

  CustomDomainName:
    Type: String
    Default: hdicr.trulyimagined.com

  ExistingCustomDomainName:
    Type: String
    Default: hdicr.trulyimagined.com

  ManageCustomDomainResources:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  ManageBasePathMapping:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  CertificateArn:
    Type: String

  # --- hdicr.com custom domain (opt-in; enabled once the ACM cert is issued) ---
  HdicrComDomainName:
    Type: String
    Default: hdicr.com

  HdicrComCertificateArn:
    Type: String
    Default: ""
    Description: ACM cert ARN (eu-west-1) for hdicr.com. Required when ManageHdicrComDomain=true.

  ManageHdicrComDomain:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  AUTH0ClientId:
    Type: String
    NoEcho: true

Conditions:
  ShouldManageHdicrComDomain: !Equals [!Ref ManageHdicrComDomain, "true"]
  ShouldCreateCustomDomain: !Equals [!Ref ManageCustomDomainResources, "true"]
  ShouldCreateBasePathMapping: !Equals [!Ref ManageBasePathMapping, "true"]
  ShouldCreateBasePathMappingWithManagedDomain: !And
    - !Condition ShouldCreateBasePathMapping
    - !Condition ShouldCreateCustomDomain
  ShouldCreateBasePathMappingWithExistingDomain: !And
    - !Condition ShouldCreateBasePathMapping
    - !Not
      - !Condition ShouldCreateCustomDomain

Resources:
  HDICRApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: hdicr-api
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'https://trulyimagined.com'"

  IdentityFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub hdicr-identity-${Environment}
      CodeUri: ../services/identity-service/dist
      Handler: index.handler
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref S3BucketName
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DbUrlSecretArn
      Events:
        Proxy:
          Type: Api
          Properties:
            RestApiId: !Ref HDICRApi
            Path: /v1/identity/{proxy+}
            Method: ANY
        VerifyConfirmed:
          Type: Api
          Properties:
            RestApiId: !Ref HDICRApi
            Path: /identity/verify-confirmed
            Method: POST

  ConsentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub hdicr-consent-${Environment}
      CodeUri: ../services/consent-service/dist
      Handler: index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DbUrlSecretArn
      Events:
        Proxy:
          Type: Api
          Properties:
            RestApiId: !Ref HDICRApi
            Path: /v1/consent/{proxy+}
            Method: ANY
        ConsentLedgerProxy:
          Type: Api
          Properties:
            RestApiId: !Ref HDICRApi
            Path: /v1/consent-ledger/{proxy+}
            Method: ANY

  # Non-extractable ECDSA P-256 key that signs Verifiable Credentials server-side
  # (Stream 3.5b). AWS KMS cannot sign Ed25519, so new credentials use an ECDSA
  # Data Integrity proof (ecdsa-jcs-2019); the legacy Ed25519 public key stays in
  # the issuer DID doc as #key-1 to verify older credentials.
  VcSigningKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub HDICR Verifiable Credential issuer signing key (${Environment})
      KeySpec: ECC_NIST_P256
      KeyUsage: SIGN_VERIFY
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableRootAccountAdmin
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"

  VcSigningKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/hdicr-vc-signing-${Environment}
      TargetKeyId: !Ref VcSigningKey

  CredentialsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub hdicr-credentials-${Environment}
      CodeUri: ../services/credentials-service/dist
      Handler: index.handler
      Environment:
        Variables:
          VC_SIGNING_KMS_KEY_ID: !Ref VcSigningKey
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DbUrlSecretArn
            - Effect: Allow
              Action:
                - kms:Sign
                - kms:GetPublicKey
              Resource: !GetAtt VcSigningKey.Arn
      Events:
        Proxy:
          Type: Api
          Properties:
            RestApiId: !Ref HDICRApi
            Path: /v1/credentials/{proxy+}
            Method: ANY

  LicensingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub hdicr-licensing-${Environment}
      CodeUri: ../services/licensing-service/dist
      Handler: index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DbUrlSecretArn
      Events:
        Proxy:
          Type: Api
          Properties:
            RestApiId: !Ref HDICRApi
            Path: /v1/license/{proxy+}
            Method: ANY
        LicensingAliasProxy:
          Type: Api
          Properties:
            RestApiId: !Ref HDICRApi
            Path: /v1/licensing/{proxy+}
            Method: ANY

  RepresentationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub hdicr-representation-${Environment}
      CodeUri: ../services/representation-service/dist
      Handler: index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DbUrlSecretArn
      Events:
        Proxy:
          Type: Api
          Properties:
            RestApiId: !Ref HDICRApi
            Path: /v1/representation/{proxy+}
            Method: ANY

  HDICRCustomDomain:
    Type: AWS::ApiGateway::DomainName
    Condition: ShouldCreateCustomDomain
    Properties:
      DomainName: !Ref CustomDomainName
      RegionalCertificateArn: !Ref CertificateArn
      EndpointConfiguration:
        Types:
          - REGIONAL

  HDICRBasePathMappingManagedDomain:
    Type: AWS::ApiGateway::BasePathMapping
    Condition: ShouldCreateBasePathMappingWithManagedDomain
    DependsOn:
      - HDICRApiprodStage
    Properties:
      DomainName: !Ref HDICRCustomDomain
      RestApiId: !Ref HDICRApi
      Stage: prod

  HDICRBasePathMappingExistingDomain:
    Type: AWS::ApiGateway::BasePathMapping
    Condition: ShouldCreateBasePathMappingWithExistingDomain
    DependsOn:
      - HDICRApiprodStage
    Properties:
      DomainName: !Ref ExistingCustomDomainName
      RestApiId: !Ref HDICRApi
      Stage: prod

  # --- hdicr.com custom domain (opt-in) — runs alongside the legacy domain ---
  HDICRComCustomDomain:
    Type: AWS::ApiGateway::DomainName
    Condition: ShouldManageHdicrComDomain
    Properties:
      DomainName: !Ref HdicrComDomainName
      RegionalCertificateArn: !Ref HdicrComCertificateArn
      EndpointConfiguration:
        Types:
          - REGIONAL

  HDICRComBasePathMapping:
    Type: AWS::ApiGateway::BasePathMapping
    Condition: ShouldManageHdicrComDomain
    DependsOn:
      - HDICRApiprodStage
    Properties:
      DomainName: !Ref HDICRComCustomDomain
      RestApiId: !Ref HDICRApi
      Stage: prod

Outputs:
  ApiEndpoint:
    Value: !Sub https://${HDICRApi}.execute-api.${AWS::Region}.amazonaws.com/prod/
  CustomDomain:
    Value: !If
      - ShouldCreateCustomDomain
      - !Ref CustomDomainName
      - !Ref ExistingCustomDomainName
  HdicrComDomain:
    Condition: ShouldManageHdicrComDomain
    Value: !Ref HdicrComDomainName
  HdicrComDomainTarget:
    Condition: ShouldManageHdicrComDomain
    Description: Point the Cloudflare CNAME for hdicr.com at this API Gateway regional domain.
    Value: !GetAtt HDICRComCustomDomain.RegionalDomainName
