AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: HDICR Service - Lambda + API Gateway

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs24.x
    Environment:
      Variables:
        NODE_ENV: !Ref Environment
        AUTH0_DOMAIN: !Ref Auth0Domain
        AUTH0_AUDIENCE: !Ref Auth0Audience
        AUTH0_CLIENT_ID: !Ref AUTH0ClientId
        HDICR_DEFAULT_TENANT_ID: !Ref HDICRDefaultTenantId
        AUTH0_ROLES_CLAIM_NAMESPACE: !Ref Auth0RolesClaimNamespace
        AUTH0_TENANT_ID_CLAIM_NAMESPACE: !Ref Auth0TenantIdClaimNamespace
        DB_POOL_SIZE: !Ref DBPoolSize
        # The DB connection string (which contains the password) is read from
        # Secrets Manager at runtime via each function's execution role — never
        # baked into a plaintext Lambda env var. Resolved by infra/database
        # DatabaseClient. AUTH0_CLIENT_SECRET / JWT_SIGNING_KEY were previously
        # set here but are not read by the request path (auth uses Auth0 JWKS),
        # so they have been removed rather than migrated.
        DB_URL_SECRET_ARN: !Ref DbUrlSecretArn

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues:
      - development
      - staging
      - production

  DbUrlSecretArn:
    Type: String
    Default: arn:aws:secretsmanager:eu-west-1:440779547223:secret:/hdicr/prod/db/url-h6XyzY
    Description: >-
      ARN of the Secrets Manager secret holding the Postgres connection string.
      Passed to the functions as DB_URL_SECRET_ARN and read at runtime; this is a
      resource identifier, not a secret value, so it is safe as a plain env var.

  Auth0Domain:
    Type: String

  Auth0Audience:
    Type: String
    # Comma-separated list of accepted API audiences. During the hdicr.com
    # cutover set both the new and legacy identifiers so existing TI tokens keep
    # validating, e.g. "https://hdicr.com,https://hdicr.trulyimagined.com".
    Default: https://hdicr.trulyimagined.com

  HDICRDefaultTenantId:
    Type: String
    Default: trulyimagined

  Auth0RolesClaimNamespace:
    Type: String
    Default: https://trulyimagined.com/roles

  Auth0TenantIdClaimNamespace:
    Type: String
    Default: https://trulyimagined.com/tenant_id

  DBPoolSize:
    Type: String
    Default: "20"

  S3BucketName:
    Type: String
    Default: trulyimagined-media

  CustomDomainName:
    Type: String
    Default: hdicr.trulyimagined.com

  ExistingCustomDomainName:
    Type: String
    Default: hdicr.trulyimagined.com

  ManageCustomDomainResources:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  ManageBasePathMapping:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  CertificateArn:
    Type: String

  # --- hdicr.com custom domain (opt-in; enabled once the ACM cert is issued) ---
  HdicrComDomainName:
    Type: String
    Default: hdicr.com

  HdicrComCertificateArn:
    Type: String
    Default: ""
    Description: ACM cert ARN (eu-west-1) for hdicr.com. Required when ManageHdicrComDomain=true.

  ManageHdicrComDomain:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  AUTH0ClientId:
    Type: String
    NoEcho: true

  # --- H2A status list (S2.H1) ---
  H2aIssuerOrigin:
    Type: String
    Default: https://trulyimagined.com
    Description: >-
      Origin the status list is published under, and the only place its id and mirrors are built
      from. One constant so D-E's handover to a neutral domain is DNS plus this parameter, not a
      code change. No trailing slash.

  H2aStatusTtlMs:
    Type: String
    Default: "300000"
    Description: >-
      How long a verifier may treat a fetched status list as fresh, in milliseconds. This IS the
      revocation horizon as far as any verifier is concerned - a list cached for an hour means a
      withdrawal can take an hour to be observed, whatever the issuer does at its end. Bounded by
      the media freshness window, not chosen for cache efficiency.

  H2aStatusMirrors:
    Type: String
    Default: ""
    Description: >-
      Comma-separated URLs of BYTE-IDENTICAL mirrors, declared in the credential so a verifier can
      fall back without asking. Byte-identical is load-bearing: the proof covers the canonical bytes
      of the whole document, so a mirror that re-serialises the JSON serves something that fails
      verification. Mirrors must be object copies, never re-renders.

Conditions:
  ShouldManageHdicrComDomain: !Equals [!Ref ManageHdicrComDomain, "true"]
  ShouldCreateCustomDomain: !Equals [!Ref ManageCustomDomainResources, "true"]
  ShouldCreateBasePathMapping: !Equals [!Ref ManageBasePathMapping, "true"]
  ShouldCreateBasePathMappingWithManagedDomain: !And
    - !Condition ShouldCreateBasePathMapping
    - !Condition ShouldCreateCustomDomain
  ShouldCreateBasePathMappingWithExistingDomain: !And
    - !Condition ShouldCreateBasePathMapping
    - !Not
      - !Condition ShouldCreateCustomDomain

Resources:
  HDICRApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: hdicr-api
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'https://trulyimagined.com'"

  IdentityFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub hdicr-identity-${Environment}
      CodeUri: ../services/identity-service/dist
      Handler: index.handler
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref S3BucketName
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DbUrlSecretArn
      Events:
        Proxy:
          Type: Api
          Properties:
            RestApiId: !Ref HDICRApi
            Path: /v1/identity/{proxy+}
            Method: ANY
        VerifyConfirmed:
          Type: Api
          Properties:
            RestApiId: !Ref HDICRApi
            Path: /identity/verify-confirmed
            Method: POST

  ConsentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub hdicr-consent-${Environment}
      CodeUri: ../services/consent-service/dist
      Handler: index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DbUrlSecretArn
      Events:
        Proxy:
          Type: Api
          Properties:
            RestApiId: !Ref HDICRApi
            Path: /v1/consent/{proxy+}
            Method: ANY
        ConsentLedgerProxy:
          Type: Api
          Properties:
            RestApiId: !Ref HDICRApi
            Path: /v1/consent-ledger/{proxy+}
            Method: ANY

  # Non-extractable ECDSA P-256 key that signs Verifiable Credentials server-side
  # (Stream 3.5b). AWS KMS cannot sign Ed25519, so new credentials use an ECDSA
  # Data Integrity proof (ecdsa-jcs-2019); the legacy Ed25519 public key stays in
  # the issuer DID doc as #key-1 to verify older credentials.
  VcSigningKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub HDICR Verifiable Credential issuer signing key (${Environment})
      KeySpec: ECC_NIST_P256
      KeyUsage: SIGN_VERIFY
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableRootAccountAdmin
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"

  VcSigningKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/hdicr-vc-signing-${Environment}
      TargetKeyId: !Ref VcSigningKey

  # ---------------------------------------------------------------------------
  # H2A ISSUER SIGNING KEY (S1.H2)
  #
  # This key signs H2A grants and status lists. It is the thing the whole programme
  # is arranged around: the claim is that Truly Imagined (the operator) and Bridle
  # (the verifier) cannot revoke or issue, because neither can reach this key.
  #
  # DISTINCT FROM VcSigningKey ABOVE, deliberately. That key is the credentials
  # issuer (#key-2) and signs Verifiable Credentials. Reusing it would mean one
  # compromise ends both the credential and the authority story, and would make
  # "who signed this" unanswerable — the separation is the point, not tidiness.
  #
  # WHY THE EXPLICIT DENY. VcSigningKey's policy grants only root kms:*, and access
  # comes from IAM policies on each function's role. That is the ordinary pattern
  # and it is not sufficient here: with it, ANY principal in the account holding
  # sufficient IAM permission can sign, so "TI cannot sign" would be a statement
  # about what we have not granted rather than about what is forbidden. An IAM
  # Allow cannot override a key-policy Deny, so the Deny below converts an absence
  # into a policy — which is what AUTHORITY-SPLIT-PROOF.md (S2.H4) must demonstrate.
  #
  # The Deny is written as an ALLOWLIST BY EXCLUSION rather than by naming TI's and
  # Bridle's principals. Naming them would be a denylist, and a denylist silently
  # stops covering anything created after it was written — including a future
  # operator, which is the entire premise of a neutral issuer.
  #
  # Note that root retains key ADMINISTRATION but is denied kms:Sign. That is
  # intended: even the account root should not mint issuance signatures outside the
  # service role. Root is not denied kms:* because a key no principal can administer
  # is unrecoverable.
  H2aIssuerSigningRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub hdicr-h2a-issuer-signing-${Environment}
      Description: >-
        The ONLY principal permitted to sign with the H2A issuer key. Assumed by the
        H2A sign/revoke functions (S2.H2, S2.H3). Signing permission is granted by the
        KEY POLICY, not by an IAM policy here - so the key names who may use it, and
        adding an IAM policy elsewhere cannot widen that set.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  H2aIssuerKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub H2A issuer signing key - grants and status lists (${Environment})
      KeySpec: ECC_NIST_P256
      KeyUsage: SIGN_VERIFY
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          # Administration only. kms:Sign is removed from root by the Deny below.
          - Sid: EnableRootAccountAdmin
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"

          # The single permitted signer.
          - Sid: AllowH2aIssuerRoleToSign
            Effect: Allow
            Principal:
              AWS: !GetAtt H2aIssuerSigningRole.Arn
            Action:
              - kms:Sign
              - kms:GetPublicKey
              - kms:DescribeKey
            Resource: "*"

          # Anyone MAY read the public key — verification is a public act and a
          # verifier that cannot fetch the key cannot check anything.
          - Sid: AllowAccountToVerifyAndReadPublicKey
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action:
              - kms:Verify
              - kms:GetPublicKey
              - kms:DescribeKey
            Resource: "*"

          # THE AUTHORITY SPLIT. Everything that is not the issuer role is denied
          # signing, whatever its IAM policy says. This is the statement
          # AUTHORITY-SPLIT-PROOF.md tests with a real role assumption (G9).
          - Sid: DenySigningToEveryPrincipalExceptTheIssuerRole
            Effect: Deny
            Principal: "*"
            Action: kms:Sign
            Resource: "*"
            Condition:
              ArnNotLike:
                # Both forms: the role itself, and the assumed-role session ARN a
                # Lambda actually presents at runtime. Matching only the role ARN
                # would deny the issuer function its own key.
                aws:PrincipalArn:
                  - !GetAtt H2aIssuerSigningRole.Arn
                  - !Sub arn:aws:sts::${AWS::AccountId}:assumed-role/hdicr-h2a-issuer-signing-${Environment}/*

  H2aIssuerKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/h2a-issuer-${Environment}
      TargetKeyId: !Ref H2aIssuerKey

  CredentialsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub hdicr-credentials-${Environment}
      CodeUri: ../services/credentials-service/dist
      Handler: index.handler
      Environment:
        Variables:
          VC_SIGNING_KMS_KEY_ID: !Ref VcSigningKey
          # The status list is signed by the h2a-issuer key, NEVER by VcSigningKey. If one key did
          # both, whoever can mint a credential could also clear a revocation bit and the
          # issuer/implementer split would be nominal (ADR-009). Passed by ALIAS rather than key
          # id so a rotation does not require a redeploy of this function.
          H2A_ISSUER_KMS_KEY_ID: !Sub alias/h2a-issuer-${Environment}
          H2A_ISSUER_ORIGIN: !Ref H2aIssuerOrigin
          H2A_STATUS_TTL_MS: !Ref H2aStatusTtlMs
          H2A_STATUS_MIRRORS: !Ref H2aStatusMirrors
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DbUrlSecretArn
            - Effect: Allow
              Action:
                - kms:Sign
                - kms:GetPublicKey
              Resource: !GetAtt VcSigningKey.Arn
            # Sign only. This function must never be able to schedule the deletion of the issuer
            # key, change its policy, or disable it — the authority to publish a status list is not
            # the authority to destroy the ability to publish one.
            - Effect: Allow
              Action:
                - kms:Sign
                - kms:GetPublicKey
              Resource: !GetAtt H2aIssuerKey.Arn
      Events:
        Proxy:
          Type: Api
          Properties:
            RestApiId: !Ref HDICRApi
            Path: /v1/credentials/{proxy+}
            Method: ANY
        # PUBLIC, and separate from the /v1 proxy on purpose. The handler skips the Auth0 check for
        # exactly this path prefix (S2.H1). A status list only authorised callers can fetch makes
        # the operator the gatekeeper of whether a revocation can be OBSERVED, which is the power
        # the issuer/implementer split exists to remove.
        H2aStatus:
          Type: Api
          Properties:
            RestApiId: !Ref HDICRApi
            Path: /h2a/status/{listId}
            Method: GET

  LicensingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub hdicr-licensing-${Environment}
      CodeUri: ../services/licensing-service/dist
      Handler: index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DbUrlSecretArn
      Events:
        Proxy:
          Type: Api
          Properties:
            RestApiId: !Ref HDICRApi
            Path: /v1/license/{proxy+}
            Method: ANY
        LicensingAliasProxy:
          Type: Api
          Properties:
            RestApiId: !Ref HDICRApi
            Path: /v1/licensing/{proxy+}
            Method: ANY

  # RepresentationFunction retired (Stream 4b): representation is a Truly-Imagined
  # vertical concern, served from the TI database, not the general HDICR registry.
  # See the trulyimagined repo `lib/hdicr/representation-client.ts` (now TI-local).

  HDICRCustomDomain:
    Type: AWS::ApiGateway::DomainName
    Condition: ShouldCreateCustomDomain
    Properties:
      DomainName: !Ref CustomDomainName
      RegionalCertificateArn: !Ref CertificateArn
      EndpointConfiguration:
        Types:
          - REGIONAL

  HDICRBasePathMappingManagedDomain:
    Type: AWS::ApiGateway::BasePathMapping
    Condition: ShouldCreateBasePathMappingWithManagedDomain
    DependsOn:
      - HDICRApiprodStage
    Properties:
      DomainName: !Ref HDICRCustomDomain
      RestApiId: !Ref HDICRApi
      Stage: prod

  HDICRBasePathMappingExistingDomain:
    Type: AWS::ApiGateway::BasePathMapping
    Condition: ShouldCreateBasePathMappingWithExistingDomain
    DependsOn:
      - HDICRApiprodStage
    Properties:
      DomainName: !Ref ExistingCustomDomainName
      RestApiId: !Ref HDICRApi
      Stage: prod

  # --- hdicr.com custom domain (opt-in) — runs alongside the legacy domain ---
  HDICRComCustomDomain:
    Type: AWS::ApiGateway::DomainName
    Condition: ShouldManageHdicrComDomain
    Properties:
      DomainName: !Ref HdicrComDomainName
      RegionalCertificateArn: !Ref HdicrComCertificateArn
      EndpointConfiguration:
        Types:
          - REGIONAL

  HDICRComBasePathMapping:
    Type: AWS::ApiGateway::BasePathMapping
    Condition: ShouldManageHdicrComDomain
    DependsOn:
      - HDICRApiprodStage
    Properties:
      DomainName: !Ref HDICRComCustomDomain
      RestApiId: !Ref HDICRApi
      Stage: prod

Outputs:
  ApiEndpoint:
    Value: !Sub https://${HDICRApi}.execute-api.${AWS::Region}.amazonaws.com/prod/

  # Exported so the failing-access-test (scripts/authority-split-test.sh, G9) can name the
  # exact key and role rather than being told them out of band. A proof that depends on
  # someone pasting the right ARN is a proof about that person's care.
  H2aIssuerKeyId:
    Description: KMS key id of the H2A issuer signing key. Signs grants and status lists.
    Value: !Ref H2aIssuerKey
  H2aIssuerKeyArn:
    Description: KMS key ARN of the H2A issuer signing key.
    Value: !GetAtt H2aIssuerKey.Arn
  H2aIssuerKeyAliasName:
    Description: Stable alias - use this, not the key id, so rotation does not change callers.
    Value: !Sub alias/h2a-issuer-${Environment}
  H2aIssuerSigningRoleArn:
    Description: >-
      The ONLY principal permitted to sign with the H2A issuer key. Every other principal -
      including Truly Imagined's Vercel role and Bridle's - is denied kms:Sign by the key
      policy itself, which an IAM Allow cannot override.
    Value: !GetAtt H2aIssuerSigningRole.Arn
  H2aStatusEndpoint:
    Description: >-
      Public, unauthenticated status list (S2.H1). Fetch as {this}/{listId}. Every other route on
      this API requires an Auth0 token; this one must not, because a status list only authorised
      callers can read makes the operator the gatekeeper of whether a revocation can be observed.
    Value: !Sub https://${HDICRApi}.execute-api.${AWS::Region}.amazonaws.com/prod/h2a/status
  H2aStatusMirrorsConfigured:
    Description: >-
      Byte-identical mirrors declared inside the signed credential. Empty until a CDN distribution
      is provisioned - the mechanism ships here, the spend does not.
    Value: !Ref H2aStatusMirrors
  CustomDomain:
    Value: !If
      - ShouldCreateCustomDomain
      - !Ref CustomDomainName
      - !Ref ExistingCustomDomainName
  HdicrComDomain:
    Condition: ShouldManageHdicrComDomain
    Value: !Ref HdicrComDomainName
  HdicrComDomainTarget:
    Condition: ShouldManageHdicrComDomain
    Description: Point the Cloudflare CNAME for hdicr.com at this API Gateway regional domain.
    Value: !GetAtt HDICRComCustomDomain.RegionalDomainName
